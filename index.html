She has fair hair, blue eyes, and she is very lovely.", "She have fair hair and blue eyes very lovely.", "She is fair hair, blue eyes and very lovely."], 0, "Đáp án: She has fair hair, blue eyes, and she is very lovely.", "She + has để nói về đặc điểm; “she is very lovely” dùng be + tính từ."], ["like / music / swimming / and / the cinema.", "Cô ấy thích âm nhạc, bơi lội và đi xem phim.", ["She like music, swim and cinema.", "She likes music, swimming, and going to the cinema.", "She liking music, swimming and the cinema."], 1, "Đáp án: She likes music, swimming, and going to the cinema.", "Chủ ngữ she nên likes; các sở thích được liệt kê song song."], ["have / younger brother / name / Bruce Walkers.", "Cô ấy có một em trai tên Bruce Walkers.", ["She has a younger brother, and his name is Bruce Walkers.", "She have younger brother name Bruce Walkers.", "She has younger brother, his name Bruce Walkers."], 0, "Đáp án: She has a younger brother, and his name is Bruce Walkers.", "“Has a younger brother” = có một em trai; danh từ số ít cần mạo từ a."], ["we / first meet / last summer / when / come to Ha Noi / her parents.", "Chúng tôi gặp nhau lần đầu mùa hè năm ngoái khi cô ấy đến Hà Nội cùng bố mẹ.", ["We first meet last summer when she come to Ha Noi with her parents.", "We first met last summer when she came to Ha Noi with her parents.", "We first meeting last summer when she came to Ha Noi."], 1, "Đáp án: We first met last summer when she came to Ha Noi with her parents.", "“Last summer” dùng quá khứ đơn: meet → met, come → came."], ["often email / each other / have a chat.", "Chúng tôi thường gửi email cho nhau và trò chuyện.", ["We often email each other and have a chat.", "We often emails each other and has a chat.", "We often emailing each other and have chat."], 0, "Đáp án: We often email each other and have a chat.", "Chủ ngữ we đi với động từ nguyên mẫu; “each other” nghĩa là lẫn nhau."], ["come / Ha Noi / again / a tour / next summer.", "Cô ấy sẽ lại đến Hà const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderTabs(){const el=$('sectionTabs');el.innerHTML='';sections.forEach((s,i)=>{let b=document.createElement('button');b.textContent=s.name;b.className=i===si?'active':'';b.onclick=()=>{si=i;qi=0;render();};el.appendChild(b);});}
function renderNav(){const el=$('qnav');el.innerHTML='';sections[si].qs.forEach((q,i)=>{let b=document.createElement('button');b.textContent=i+1;b.className=(i===qi?'active ':'')+(state[si][i].locked?'done':'');b.onclick=()=>{qi=i;render();};el.appendChild(b);});}
function normalizeAnswer(s){
 return String(s||"").toLowerCase().trim().replace(/[’‘]/g,"'").replace(/[.!?,;:]+$/,"").replace(/\s+/g," ");
}
function expectedAnswer(q){return q[2][q[3]];}
function render(){const sec=sections[si],q=sec.qs[qi],st=state[si][qi];$('secTitle').textContent=sec.name;$('qCount').textContent=`Câu ${qi+1} / ${sec.qs.length}`;$('qState').textContent=st.locked?'Đã trả lời – đáp án đã khóa':'Chưa trả lời';$('score').textContent=`Điểm: ${state.flat().filter(x=>x.locked&&x.correct).length} / ${state.flat().filter(x=>x.locked).length} câu đã làm`;renderTabs();renderNav();
$('question').textContent=q[0];$('qvi').textContent=q[1]||'';if(sec.passage){$('passage').textContent=sec.passage;$('passage').classList.remove('hidden')}else{$('passage').classList.add('hidden');$('passage').textContent=''}
const opts=$('options');opts.innerHTML='';
if(sec.answerMode==='text'){
 const box=document.createElement('div');box.style.display='grid';box.style.gap='10px';
 const label=document.createElement('label');label.innerHTML='<strong>Viết câu trả lời của bạn:</strong>';
 const inp=document.createElement('input');inp.id='typedAnswer';inp.type='text';inp.placeholder=si===7?'Write the complete sentence...':'Type your answer...';inp.autocomplete='off';inp.spellcheck=false;inp.value=st.typed||'';inp.disabled=st.locked;inp.style.width='100%';inp.style.padding='12px';inp.style.border='2px solid #dbe4ef';inp.style.borderRadius='10px';inp.style.font='inherit';
 const submit=document.createElement('button');submit.className='primary';submit.textContent='Check / Chấm câu này';submit.disabled=st.locked;submit.onclick=()=>submitTyped();
 inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!st.locked)submitTyped();});
 box.append(label,inp,submit);opts.appendChild(box);
}else{
 q[2].forEach((op,i)=>{let b=document.createElement('button');b.className='option';b.disabled=st.locked;b.innerHTML=`<span class="letter">${String.fromCharCode(65+i)}.</span><span>${op}</span>`;if(st.locked&&i===q[3])b.classList.add('correct');if(st.locked&&i===st.chosen&&i!==q[3])b.classList.add('wrong');b.onclick=()=>choose(i);opts.appendChild(b);});
}
const fb=$('feedback');if(st.locked){fb.className='feedback '+(st.correct?'good':'bad');fb.innerHTML=`<h3>${st.correct?'Chính xác! ✓':'Chưa chính xác ✗'}</h3><p><strong>${sec.answerMode==='text'?'Đáp án mẫu':'Đáp án'}:</strong> ${esc(expectedAnswer(q))}</p><p>${esc(q[4])}</p><p><strong>Nghĩa tiếng Việt:</strong> ${esc(q[5]||q[1]||'')}</p>`;}else{fb.className='feedback hidden';fb.innerHTML='';}
$('prev').disabled=qi===0;$('next').disabled=qi===sec.qs.length-1;
}
function submitTyped(){
 const sec=sections[si],q=sec.qs[qi],st=state[si][qi];if(st.locked)return;
 const inp=$('typedAnswer');const val=inp?inp.value.trim():'';
 if(!val){alert('Vui lòng nhập câu trả lời trước khi chấm.');return;}
 st.typed=val;st.chosen=-1;st.locked=true;st.correct=normalizeAnswer(val)===normalizeAnswer(expectedAnswer(q));render();
}
function choose(i){const st=state[si][qi];if(st.locked)return;st.chosen=i;st.locked=true;st.correct=i===sections[si].qs[qi][3];render();}
$('prev').onclick=()=>{if(qi>0){qi--;render();}};$('next').onclick=()=>{if(qi<sections[si].qs.length-1){qi++;render();}};
$('resetSection').onclick=()=>{if(confirm('Làm lại toàn bộ phần này? Kết quả của phần đang chọn sẽ bị xóa.')){state[si]=sections[si].qs.map(()=>({chosen:null,locked:false}));qi=0;render();}};
$('login').onclick=()=>{if($('pw').value==='367'){$('gate').classList.add('hidden');$('app').classList.remove('hidden');render();}else{$('pwmsg').textContent='Mật khẩu chưa đúng. Vui lòng thử lại.';$('pw').value='';}};
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')$('login').click();});
document.addEventListener('copy',e=>e.preventDefault());document.addEventListener('cut',e=>e.preventDefault());document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['c','x','a','s','p'].includes(e.key.toLowerCase()))e.preventDefault();});
</script></body></html>
